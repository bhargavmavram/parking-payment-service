spring.application.name=${SPRING_APPLICATION_NAME:parking-payment-service}
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parking_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parking_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

parking.jwt.secret=${PARKING_JWT_SECRET:parking-development-secret-key-change-me-please-32bytes-minimum}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always